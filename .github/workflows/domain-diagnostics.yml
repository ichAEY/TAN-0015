name: Domain Diagnostics

on:
  push:
    branches: [main]

jobs:
  domains:
    runs-on: ubuntu-latest
    steps:
      - name: List issued tanem.ru domains
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://api.certspotter.com/v1/issuances?domain=tanem.ru&include_subdomains=true&expand=dns_names' > /tmp/tanem-certs.json
          jq -r '.[] | .dns_names[]?' /tmp/tanem-certs.json             | sed 's/^\*\.//'             | grep -E '(^|\.)tanem\.ru$'             | sort -u
