name: Domain Diagnostics

on:
  push:
    branches: [main]

jobs:
  domains:
    runs-on: ubuntu-latest
    steps:
      - name: List issued tanem.ru domains
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://crt.sh/?q=%25.tanem.ru&output=json' > /tmp/tanem-certs.json
          jq -r '.[].name_value' /tmp/tanem-certs.json             | tr '\r' '\n'             | sed 's/^\*\.//'             | grep -E '(^|\.)tanem\.ru$'             | sort -u
